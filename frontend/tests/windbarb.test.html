<!doctype html><html><body><pre id="out"></pre><div id="probe"></div><script type="module">
import { check, done } from "./harness.js";
import { windBarbSVG } from "../src/lib/windbarb.js";
// Standard barb notation: 5 kt half barb, 10 kt full barb, 50 kt pennant.
const count = (svg, what) => { document.getElementById("probe").innerHTML = svg; const root = document.querySelector("#probe svg g"); if (!root) return 0; const els = root.querySelectorAll(what); return els.length / 2; }; // halo + color layers
check("calm draws a ring and no staff", windBarbSVG({ speedKt: 0, calm: true, color: "#fff", size: 40 }).includes("<circle") && !windBarbSVG({ speedKt: 0, calm: true, color: "#fff", size: 40 }).includes("<line"));
check("unknown speed draws the -- placeholder", windBarbSVG({ speedKt: null, color: "#fff", size: 40 }).includes("--"));
check("15 kt = 1 full + 1 half barb (+ staff)", count(windBarbSVG({ speedKt: 15, dirDeg: 270, color: "#fff", size: 60 }), "line") === 3);
check("25 kt = 2 full + 1 half", count(windBarbSVG({ speedKt: 25, dirDeg: 270, color: "#fff", size: 60 }), "line") === 4);
check("65 kt = 1 pennant + 1 full + 1 half", count(windBarbSVG({ speedKt: 65, dirDeg: 90, color: "#fff", size: 60 }), "polygon") === 1 && count(windBarbSVG({ speedKt: 65, dirDeg: 90, color: "#fff", size: 60 }), "line") === 3);
check("the staff is rotated to the wind direction", windBarbSVG({ speedKt: 10, dirDeg: 230, color: "#fff", size: 60 }).includes("rotate(230 "));
check("variable wind is not rotated and is marked VRB", windBarbSVG({ speedKt: 5, variable: true, color: "#fff", size: 60 }).includes("rotate(0 ") && windBarbSVG({ speedKt: 5, variable: true, color: "#fff", size: 60 }).includes(">VRB<"));
check("the category color is used for the strokes", windBarbSVG({ speedKt: 10, dirDeg: 0, color: "#22c55e", size: 60 }).includes('stroke="#22c55e"'));
done();
</script></body></html>
