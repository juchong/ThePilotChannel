services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hangar-display:latest
    container_name: hangar-display
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Optional. When set, /admin and config writes require this password
      # (HTTP Basic auth, any username). Put it in a .env file next to this
      # compose file: HANGAR_ADMIN_PASSWORD=... (the camera URLs live in the
      # same file, see the go2rtc service below).
      HANGAR_ADMIN_PASSWORD: ${HANGAR_ADMIN_PASSWORD:-}
      # The camera stream relay (the go2rtc service below), reached over the
      # compose network only.
      HANGAR_GO2RTC: http://go2rtc:1984
    volumes:
      # bind-mount the data DIRECTORY (not a single file) so atomic writes work
      - ./data:/data
    # Lets data_source.local_url reach a receiver on the Pi itself as
    # http://host.docker.internal/... under rootful Docker. Under rootless
    # Docker this name is not routable to the host: use the Pi's LAN IP instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening: nothing in the container needs capabilities or a writable
    # root filesystem; config writes go to the /data bind mount.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # Cap the container log on disk (the OS runs from an SD card).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Camera stream relay for the camera view. It pulls the cameras' RTSPS streams and
  # serves them to the app's /api/cameras/ws relay as fragmented MP4 without
  # re-encoding. The stream URLs carry access tokens, so they are in neither this file
  # nor deploy/go2rtc.yaml: each stream slot there (cam1 to cam12) expands its URL from
  # the environment below, which compose fills from .env (HANGAR_CAM1 to HANGAR_CAM12).
  # It publishes no port and its RTSP, WebRTC and SRTP listeners are off: only the app
  # container reaches it, through the API on 1984.
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: hangar-go2rtc
    restart: unless-stopped
    command: [go2rtc, -config, /config/go2rtc.yaml]
    environment:
      HANGAR_CAM1: ${HANGAR_CAM1:-}
      HANGAR_CAM2: ${HANGAR_CAM2:-}
      HANGAR_CAM3: ${HANGAR_CAM3:-}
      HANGAR_CAM4: ${HANGAR_CAM4:-}
      HANGAR_CAM5: ${HANGAR_CAM5:-}
      HANGAR_CAM6: ${HANGAR_CAM6:-}
      HANGAR_CAM7: ${HANGAR_CAM7:-}
      HANGAR_CAM8: ${HANGAR_CAM8:-}
      HANGAR_CAM9: ${HANGAR_CAM9:-}
      HANGAR_CAM10: ${HANGAR_CAM10:-}
      HANGAR_CAM11: ${HANGAR_CAM11:-}
      HANGAR_CAM12: ${HANGAR_CAM12:-}
    volumes:
      - ./deploy/go2rtc.yaml:/config/go2rtc.yaml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
